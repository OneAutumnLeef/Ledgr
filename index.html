<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="Ledgr personal finance dashboard for Indian bank users."
    />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <title>Ledgr</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0A0A0F;
        color: #F3F4F6;
        font-family: system-ui, sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 28%),
          radial-gradient(circle at left center, rgba(200, 241, 53, 0.10), transparent 24%),
          #0A0A0F;
      }

      .boot-card {
        width: min(560px, 100%);
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.08);
        background: rgba(19, 19, 26, 0.82);
        padding: 32px;
        box-shadow: 0 22px 80px rgba(0,0,0,0.45);
      }

      .boot-card h1 {
        margin: 0 0 8px;
        font-size: 32px;
      }

      .boot-card p {
        margin: 0;
        color: rgba(255,255,255,0.72);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-fallback">
        <div class="boot-card">
          <h1>Ledgr is starting…</h1>
          <p>If this screen stays here, run the app through Vite with <code>npm run dev</code> instead of opening <code>index.html</code> directly.</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="boot-fallback">
        <div class="boot-card">
          <h1>JavaScript is required</h1>
          <p>Enable JavaScript to load the Ledgr dashboard.</p>
        </div>
      </div>
    </noscript>
    <script>
      // Restores original path/query when redirected from 404.html on GitHub Pages.
      (function () {
        var search = window.location.search;
        if (!search || search.indexOf("?p=") !== 0) return;

        var encodedPath = search.slice(3).split("&")[0] || "";
        var decodedPath = encodedPath.replace(/~and~/g, "&");
        var hashIndex = search.indexOf("&h=");
        var hash = hashIndex >= 0 ? decodeURIComponent(search.slice(hashIndex + 3)) : "";
        var newUrl = decodeURIComponent(decodedPath) + window.location.hash;

        if (hash) {
          newUrl = decodeURIComponent(decodedPath) + hash;
        }

        window.history.replaceState(null, "", newUrl || "/");
      })();
    </script>
    <script type="module" src="./src/main.jsx"></script>
  </body>
  </html>
